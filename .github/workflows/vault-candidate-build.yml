name: Vault candidate build (pinned GSD source)

on:
  workflow_dispatch:
    inputs:
      gsd_sha:
        description: Exact open-gsd/gsd-pi commit to build (40-char SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-build:
    if: github.repository == 'pimmink/gsd-pi'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout the pinned GSD source (not the default branch)
        uses: actions/checkout@v4
        with:
          repository: pimmink/gsd-pi
          ref: ${{ inputs.gsd_sha }}
          persist-credentials: false

      - name: Verify the checked-out SHA equals the pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.gsd_sha }}"
          echo "gsd_head=$(git rev-parse HEAD)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (CI route, frozen lockfile)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GSD_SKIP_RTK_INSTALL: '1'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native addon (dev profile, CI route)
        run: pnpm run build:native:test

      - name: Build core (CI route)
        run: pnpm run build:core

      - name: Pack the candidate exactly as published
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --pack-destination "$RUNNER_TEMP/candidate"
          cd "$RUNNER_TEMP/candidate"
          sha256sum *.tgz | tee SHA256SUMS
          tar -tzf *.tgz | rg 'dist/cmux-vault\.js$' || { echo "cmux-vault.js missing from pack"; exit 1; }

      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-gsd-candidate-${{ inputs.gsd_sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: warn
