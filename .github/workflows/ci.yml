# TEMPLATE ONLY: replace 1bcce23aad0a7b73dae8fe85abdf4788bf0a9b72 with the reviewed 40-character fork commit.
# Install as EXISTING .github/workflows/ci.yml on a fork-only CI-control branch.
# workflow-control github.sha is NOT the tested source revision.
name: Fork auto-recovery focused CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-auto-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: '1bcce23aad0a7b73dae8fe85abdf4788bf0a9b72'
  EXPECTED_TEST_FILE_COUNT: '24'
  GSD_NATIVE_PREFER_LOCAL: '1'
  RUSTFLAGS: '-C target-cpu=x86-64'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  GSD_SKIP_RTK_INSTALL: '1'
  GSD_SKIP_DEP_REPAIR: '1'
  # Explicit focused inventory, NOT full-suite coverage. Every file is required.
  TEST_FILES: |
    src/resources/extensions/gsd/tests/auto-recovery-authorization.test.ts
    src/resources/extensions/gsd/tests/auto-recovery-options.test.ts
    src/resources/extensions/gsd/tests/commands-blocker.test.ts
    src/resources/extensions/gsd/tests/pause-blocker-domain-operation.test.ts
    src/resources/extensions/gsd/tests/resolve-auto-pause-blocker-by-id.test.ts
    src/resources/extensions/gsd/tests/mcp-blocker-boundary-pr2865.integration.test.ts
    src/resources/extensions/gsd/tests/db-access-guardrails.test.ts
    src/resources/extensions/gsd/tests/sqlite-readonly.test.ts
    src/resources/extensions/gsd/tests/auto-session-encapsulation.test.ts
    src/resources/extensions/gsd/tests/auto-recovery.test.ts
    src/resources/extensions/gsd/tests/consent-question.test.ts
    src/resources/extensions/gsd/tests/unit-ownership.test.ts
    src/resources/extensions/gsd/tests/dispatch-preview-read-only.test.ts
    src/resources/extensions/gsd/tests/doctor-read-only.test.ts
    src/resources/extensions/gsd/tests/single-writer-invariant.test.ts
    src/resources/extensions/gsd/tests/single-writer-v3-tool-surface.test.ts
    src/resources/extensions/gsd/tests/commands-dispatcher-validation-block.test.ts
    src/resources/extensions/gsd/tests/commands-dispatcher-workspace-git.test.ts
    src/resources/extensions/gsd/tests/commands-dispatcher-unmerged-milestone.test.ts
    src/resources/extensions/gsd/tests/dispatcher-stuck-planning.test.ts
    src/resources/extensions/gsd/tests/native-git-bridge-exec-fallback.test.ts
    src/resources/extensions/gsd/tests/native-has-changes-cache.test.ts
    src/resources/extensions/gsd/tests/native-merge-regular.test.ts
    src/resources/extensions/gsd/tests/native-git-infra-errors.test.ts

jobs:
  prerequisites:
    if: github.repository == 'pimmink/gsd-pi'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact tested source (not workflow-control SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pimmink/gsd-pi
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source and required inventory before installing
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'Tested source: pimmink/gsd-pi@%s\nWorkflow-control SHA: %s\n' "$SOURCE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          mapfile -t files < <(printf '%s\n' "$TEST_FILES" | grep -v '^$')
          test "${#files[@]}" -eq "$EXPECTED_TEST_FILE_COUNT"
          for file in "${files[@]}"; do test -s "$file"; done
          test -s src/resources/extensions/gsd/tests/resolve-ts.mjs
          test -s native/scripts/build.js
          test -s scripts/ci-pack-build-artifacts.sh
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1
      - name: Setup Node 22 (latest patch includes registerHooks)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-linux-native-build-deps
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual native fixture addon (upstream CI command)
        run: node native/scripts/build.js --dev --test-fault-injection
      - name: Build root core prerequisites (no web host / Next build)
        run: pnpm run build:core
      - name: Typecheck extensions
        run: pnpm run typecheck:extensions
      - name: Require source-built native binding and package build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s native/addon/gsd_engine.dev.node
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const native = require('./native/addon/gsd_engine.dev.node');
          for (const key of ['SqliteFileIdentityLock', 'ProjectionRootIdentityLock']) {
            assert.equal(typeof native[key], 'function', `missing native export ${key}`);
          }
          console.log('Source-built native fixture addon loaded on', process.version);
          NODE
          bash scripts/ci-pack-build-artifacts.sh
          printf '%s\n' "$SOURCE_SHA" > fork-ci-source-sha.txt
      - name: Upload source-bound prerequisites
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auto-recovery-prerequisites
          path: |
            ci-build-artifacts.tar.gz
            fork-ci-source-sha.txt
          if-no-files-found: error
          retention-days: 2

  focused-tests:
    needs: prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout identical tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pimmink/gsd-pi
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'Shard %s/4 tests pimmink/gsd-pi@%s; control=%s\n' "$SHARD" "$SOURCE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-linux-native-build-deps
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: auto-recovery-prerequisites
          path: .fork-ci-prerequisites
      - name: Restore and verify native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(< .fork-ci-prerequisites/fork-ci-source-sha.txt)" = "$SOURCE_SHA"
          tar xzf .fork-ci-prerequisites/ci-build-artifacts.tar.gz
          test -s native/addon/gsd_engine.dev.node
          node --input-type=commonjs -e "require('./native/addon/gsd_engine.dev.node'); console.log('Native fixture addon loaded:', process.version)"
      - name: Run real Node file shard with repository loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fork-ci-results
          mapfile -t files < <(printf '%s\n' "$TEST_FILES" | grep -v '^$')
          test "${#files[@]}" -eq "$EXPECTED_TEST_FILE_COUNT"
          for file in "${files[@]}"; do test -s "$file"; done
          # One shared ordered inventory, one disjoint Node shard per job.
          # No name filtering, fallback loader, mocked native addon or skip flags.
          node --import ./src/resources/extensions/gsd/tests/resolve-ts.mjs \
            --experimental-strip-types --test --test-timeout=180000 \
            --test-concurrency=1 --test-shard="$SHARD/4" --test-reporter=tap \
            "${files[@]}" | tee ".fork-ci-results/shard-$SHARD.tap"
      - name: Record counts and reject empty/skipped/cancelled/TODO coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fork-ci-results
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const shard = Number(process.env.SHARD);
          const tap = readFileSync(`.fork-ci-results/shard-${shard}.tap`, 'utf8');
          const counts = {};
          for (const key of ['tests', 'pass', 'fail', 'cancelled', 'skipped', 'todo']) {
            const matches = [...tap.matchAll(new RegExp(`^# ${key} (\\d+)\\s*$`, 'gm'))];
            assert.ok(matches.length, `missing TAP total: ${key}`);
            counts[key] = Number(matches.at(-1)[1]);
          }
          const files = process.env.TEST_FILES.trim().split('\n');
          const result = { sourceSha: process.env.SOURCE_SHA, controlSha: process.env.GITHUB_SHA,
            shard, shards: 4, inventoryFiles: files, plannedFilesPerShard: 4,
            nodeVersion: process.version, counts };
          writeFileSync(`.fork-ci-results/shard-${shard}.json`, JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          assert.ok(counts.tests > 0, 'empty test shard');
          for (const key of ['fail', 'cancelled', 'skipped', 'todo']) assert.equal(counts[key], 0, key);
          assert.equal(counts.pass, counts.tests, 'all counted tests must pass');
          NODE
      - name: Upload per-shard evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auto-recovery-results-${{ matrix.shard }}
          path: .fork-ci-results/
          include-hidden-files: true # Scoped directory contains only generated TAP/JSON.
          if-no-files-found: error
          retention-days: 2

  focused-gate:
    if: always() && github.repository == 'pimmink/gsd-pi'
    needs: [prerequisites, focused-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PREREQUISITES_RESULT: ${{ needs.prerequisites.result }}
      TESTS_RESULT: ${{ needs.focused-tests.result }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: auto-recovery-results-*
          merge-multiple: true
          path: .fork-ci-results
      - name: Require all four source-bound shards and report focused coverage totals
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const files = process.env.TEST_FILES.trim().split('\n');
          assert.equal(files.length, Number(process.env.EXPECTED_TEST_FILE_COUNT));
          assert.equal(new Set(files).size, Number(process.env.EXPECTED_TEST_FILE_COUNT));
          const totals = { tests: 0, pass: 0, fail: 0, cancelled: 0, skipped: 0, todo: 0 };
          for (let shard = 1; shard <= 4; shard++) {
            const result = JSON.parse(readFileSync(`.fork-ci-results/shard-${shard}.json`, 'utf8'));
            assert.equal(result.sourceSha, process.env.SOURCE_SHA);
            assert.equal(result.controlSha, process.env.GITHUB_SHA);
            assert.equal(result.shard, shard);
            assert.equal(result.shards, 4);
            assert.equal(result.plannedFilesPerShard, 4);
            assert.match(result.nodeVersion, /^v22\./);
            assert.deepEqual(result.inventoryFiles, files);
            assert.ok(result.counts.tests > 0);
            for (const key of Object.keys(totals)) {
              assert.ok(Number.isSafeInteger(result.counts[key]) && result.counts[key] >= 0, key);
              totals[key] += result.counts[key];
            }
          }
          const summary = `## Focused auto-recovery evidence\n\nTested source: pimmink/gsd-pi@${process.env.SOURCE_SHA}\n\nWorkflow-control SHA (not tested source): ${process.env.GITHUB_SHA}\n\nInventory: ${files.length} files; 4 disjoint Node file shards (${files.length / 4} files each).\n\nTAP totals: ${JSON.stringify(totals)}\n\nThis is focused regression coverage, not full-suite or code-percentage coverage.\n`;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          assert.equal(process.env.PREREQUISITES_RESULT, 'success');
          assert.equal(process.env.TESTS_RESULT, 'success');
          for (const key of ['fail', 'cancelled', 'skipped', 'todo']) assert.equal(totals[key], 0, key);
          assert.equal(totals.pass, totals.tests);
          NODE
